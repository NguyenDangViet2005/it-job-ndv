services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: it_job
      POSTGRES_USER: it_job
      POSTGRES_PASSWORD: it_job_local
    volumes:
      - postgres15-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "it_job", "-d", "it_job", "-h", "127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./be-nestjs
      target: local
    env_file: .env.docker
    environment:
      DATABASE_URL: postgresql://it_job:it_job_local@postgres:5432/it_job
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:${WEB_PORT:-3001}
      BACKEND_URL: http://localhost:${API_PORT:-8081}
      COOKIE_ALLOW_LOCAL_HTTP: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8081/api/health').then(async r => { if (!r.ok || (await r.json()).data?.status !== 'healthy') process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./FE
      args:
        NEXT_PUBLIC_BE_ENDPOINT: http://localhost:${API_PORT:-8081}/api
        NEXT_PUBLIC_SITE_URL: http://localhost:${WEB_PORT:-3001}
    environment:
      API_INTERNAL_URL: http://api:8081/api
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3001"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres15-data:
